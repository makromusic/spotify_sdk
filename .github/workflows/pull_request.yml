name: spotify_sdk
on: pull_request

jobs:
  # The iOS plugin's redirect routing is pure Swift with no Flutter or SpotifyiOS import, so it runs
  # here without an Xcode project, a host app or the vendored framework. Needs macOS for Swift.
  ios-routing-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test redirect routing
        run: swift test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: flutter packages get
      - name: Format
        run: dart format --set-exit-if-changed lib test example
      - name: Analyze
        run: flutter analyze lib test example --no-fatal-infos
      - name: Publish dry run
        run: flutter pub publish --dry-run
      - name: Build web version
        run: |
              cd example
              flutter build web

  pana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2

      - name: Install Dependencies
        run: |
          flutter packages get
          flutter pub global activate pana
          sudo apt-get install webp

      - name: Verify Pub Score
        run: ./.github/scripts/verify_pub_score.sh
